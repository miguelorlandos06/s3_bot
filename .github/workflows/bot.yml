name: Nuvola Bot (Python)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: s3-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias base
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default,curl-cffi]"

      - name: Instalar picta-dlp (desde carpeta local)
        timeout-minutes: 5
        run: |
          cd picta-dlp
          python -m pip install -v .
          cd ..

      - name: Instalar dependencias de Python
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt

      - name: Verificar binarios
        run: |
          which yt-dlp
          which picta-dlp
          yt-dlp --version
          picta-dlp --version || true

      - name: Preparar cookies yt-dlp
        run: |
          if [ -n "${{ secrets.YTDLP_COOKIES_B64 }}" ]; then
            echo "${{ secrets.YTDLP_COOKIES_B64 }}" | base64 -d > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TODUS_TMP: ${{ runner.temp }}/todus
          S3_BASE_URL: https://s3.todus.cu
          YTDLP_IMPERSONATE: chrome
          PICTA_USER: ${{ secrets.PICTA_USER }}
          PICTA_PASS: ${{ secrets.PICTA_PASS }}
        run: |
          mkdir -p "$TODUS_TMP"
          python bot.py

      - name: Relanzar bot automáticamente
        if: success() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          sleep 10
          gh workflow run bot.yml --ref main
