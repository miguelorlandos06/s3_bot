name: Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: todus-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Check secret presence
        env:
          AID: ${{ secrets.API_ID }}
          AHASH: ${{ secrets.API_HASH }}
          BTOK: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$AID" ] || [ -z "$AHASH" ] || [ -z "$BTOK" ]; then
            echo "::error::Falta algun secret."
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start telegram-bot-api local server
        run: |
          TG_DIR=/var/lib/telegram-bot-api
          sudo mkdir -p "$TG_DIR/tmp"
          sudo chmod -R 777 "$TG_DIR"

          docker rm -f tg-bot-api 2>/dev/null || true

          docker run -d --name tg-bot-api \
            -u "$(id -u):$(id -g)" \
            -p 127.0.0.1:8081:8081 \
            -v "$TG_DIR:$TG_DIR" \
            -e TELEGRAM_API_ID=${{ secrets.API_ID }} \
            -e TELEGRAM_API_HASH=${{ secrets.API_HASH }} \
            -e TELEGRAM_LOCAL=1 \
            -e TELEGRAM_WORK_DIR="$TG_DIR" \
            -e TELEGRAM_TEMP_DIR="$TG_DIR/tmp" \
            aiogram/telegram-bot-api:latest

          ready=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081/" || echo "000")
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "listo en $((i*2))s (HTTP $code)"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs tg-bot-api; exit 1; fi

          docker exec tg-bot-api sh -c 'ls -la "$TELEGRAM_WORK_DIR" 2>/dev/null && echo DIR_OK || echo DIR_FAIL' || true
          docker logs tg-bot-api 2>&1 | tail -20 || true
          sleep 5

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_API_URL: http://localhost:8081/bot
          TELEGRAM_LOCAL_MODE: "true"
          TG_BOT_API_DIR: /var/lib/telegram-bot-api
          TODUS_TMP: /tmp/todus
          PORT: "10000"
        run: python bot.py

      - name: Dump logs on failure
        if: failure() || cancelled()
        run: |
          echo "--- logs tg-bot-api ---"
          docker logs tg-bot-api 2>&1 | tail -200 || true
          echo "--- arbol ---"
          sudo find /var/lib/telegram-bot-api -maxdepth 5 2>/dev/null | head -100 || true
