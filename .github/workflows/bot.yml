name: Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: todus-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Check secret presence
        env:
          AID: ${{ secrets.API_ID }}
          AHASH: ${{ secrets.API_HASH }}
          BTOK: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "API_ID length:    ${#AID}"
          echo "API_HASH length:  ${#AHASH}"
          echo "BOT_TOKEN length: ${#BTOK}"
          if [ -z "$AID" ] || [ -z "$AHASH" ] || [ -z "$BTOK" ]; then
            echo "::error::Falta algun secret."
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start telegram-bot-api local server
        run: |
          mkdir -p /tmp/tg-data
          docker rm -f tg-bot-api 2>/dev/null || true

          docker run -d --name tg-bot-api \
            -p 127.0.0.1:8081:8081 \
            -v /tmp/tg-data:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID=${{ secrets.API_ID }} \
            -e TELEGRAM_API_HASH=${{ secrets.API_HASH }} \
            -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest \
            --local \
            --http-port=8081 \
            --dir=/var/lib/telegram-bot-api

          echo "Esperando a telegram-bot-api (acepto cualquier HTTP, incluido 404)..."
          ready=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081/" || echo "000")
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "puerto abierto en $((i*2))s (HTTP $code)"
              ready=1
              break
            fi
            sleep 2
          done

          echo "--- estado del contenedor ---"
          docker ps -a --filter name=tg-bot-api || true

          echo "--- logs del server local (ultimas 60 lineas) ---"
          docker logs tg-bot-api 2>&1 | tail -60 || true

          if [ "$ready" != "1" ]; then
            echo "::error::telegram-bot-api no abrio el puerto en 90s"
            echo "--- logs completos ---"
            docker logs tg-bot-api 2>&1 || true
            exit 1
          fi

          # Espera extra para que termine de sincronizar con los DC de Telegram
          echo "Esperando sincronizacion con Telegram (10s)..."
          sleep 10

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_API_URL: http://localhost:8081/bot
          TELEGRAM_LOCAL_MODE: "true"
          TG_BOT_API_DIR: /tmp/tg-data
          TODUS_TMP: /tmp/todus
          PORT: "10000"
        run: python bot.py

      - name: Dump tg-bot-api logs on failure
        if: failure()
        run: |
          echo "--- logs del server local ---"
          docker logs tg-bot-api 2>&1 | tail -200 || true
          echo "--- procesos python ---"
          ps aux | grep -E 'python|bot.py' | grep -v grep || true
