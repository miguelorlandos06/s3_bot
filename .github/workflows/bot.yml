name: Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: todus-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (quickjs-ng, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential git cmake
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/qjs-src
          cd /tmp/qjs-src
          make
          sudo cp /tmp/qjs-src/build/qjs /usr/local/bin/qjs
          qjs --version

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Decode cookies (YouTube + Facebook)
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
        run: |
          if [ -n "$YTDLP_COOKIES_B64" ]; then
            echo "$YTDLP_COOKIES_B64" | base64 -d > cookies.txt
          fi
          if [ -n "$FB_COOKIES_B64" ]; then
            echo "$FB_COOKIES_B64" | base64 -d > cookies_fb.txt
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          YTDLP_COOKIES: cookies.txt
          FB_COOKIES: cookies_fb.txt
        run: python bot.py
