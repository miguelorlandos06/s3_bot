name: Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: todus-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install system deps (quickjs, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -L -o /tmp/qjs.tar.xz \
            https://github.com/quickjs-ng/quickjs/releases/download/v0.10.1/qjs-linux-x86_64.tar.xz || true
          if [ -f /tmp/qjs.tar.xz ]; then
            tar -xf /tmp/qjs.tar.xz -C /tmp || true
            find /tmp -name qjs -type f -exec sudo cp {} /usr/local/bin/qjs \; || true
            sudo chmod +x /usr/local/bin/qjs || true
          fi
          qjs --version || echo "qjs no disponible, YouTube puede fallar"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Decode yt-dlp cookies
        if: ${{ secrets.YTDLP_COOKIES_B64 != '' }}
        run: echo "${{ secrets.YTDLP_COOKIES_B64 }}" | base64 -d > cookies.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          YTDLP_COOKIES: cookies.txt
        run: python bot.py
