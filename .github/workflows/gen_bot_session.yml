name: Gen Bot Session

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pyrogram
        run: pip install pyrogram tgcrypto

      - name: Generate bot session string
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pyrogram import Client
          with Client(
              name=":memory:",
              api_id=int(os.environ["API_ID"]),
              api_hash=os.environ["API_HASH"],
              bot_token=os.environ["BOT_TOKEN"],
              in_memory=True,
          ) as app:
              me = app.get_me()
              print(f"BOT_USERNAME: @{me.username}")
              print("SESSION_STRING_BEGIN")
              print(app.export_session_string())
              print("SESSION_STRING_END")
          PY
